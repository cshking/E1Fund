{% extends "base.html" %}
{% block title %}修改密码 - {{ project }}{% endblock %}
{% block content %}
<div class="panel" style="max-width:380px;margin:24px auto">
  <h2>修改管理员密码</h2>
  <form method="post" action="{{ url_for('change_password') }}">
    <label>原密码</label>
    <input type="password" name="old" required autocomplete="current-password">
    <label>新密码（≥6位）</label>
    <input type="password" name="new1" required autocomplete="new-password">
    <label>确认新密码</label>
    <input type="password" name="new2" required autocomplete="new-password">
    <div style="margin-top:14px">
      <button type="submit">更新密码</button>
      <a class="btn ghost" href="{{ url_for('admin_dashboard') }}">返回</a>
    </div>
  </form>
  <p class="muted">密码以哈希方式存储，不会以明文保存。</p>
</div>
{% endblock %}
